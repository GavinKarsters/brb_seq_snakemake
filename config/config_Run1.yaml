# ── Input lane files ──────────────────────────────────────────────────────────
lane_r1: "/hpc/umc_kaaij/gkarsters/active_raw_data/BRB_seq_gastruloids_120h/V350405307_L02_read_1.fq.gz"
lane_r2: "/hpc/umc_kaaij/gkarsters/active_raw_data/BRB_seq_gastruloids_120h/V350405307_L02_read_2.fq.gz"

# ── Barcode / sample metadata ─────────────────────────────────────────────────
brb_barcodes: "config/alitheia_brb_barcodes_v5D_384_brb.txt" 
demultiplex_tsv: "/hpc/umc_kaaij/gkarsters/Snakemake/Pipelines/BRB-seq/demultiplex_gastruloids_zfp_Run1.tsv"

# ── Reference (Mouse) ─────────────────────────────────────────────────────────
star_genome_dir: "/hpc/umc_kaaij/gkarsters/references/Rna-seq/reference_star_2.7.11b"
gtf: "/hpc/umc_kaaij/gkarsters/references/Rna-seq/reference_star_2.7.11b/gencode.vM25.primary_assembly.annotation.gtf"

# ── Output directories ────────────────────────────────────────────────────────
# STARsolo does not produce per-sample FASTQs — demux is internal.
# Structure:
#   result_dir/
#   ├── qc/          ← FastQC + MultiQC
#   ├── fastq/       ← (unused in this pipeline; STARsolo demuxes internally)
#   ├── starsolo/    ← STAR logs, Solo.out/, whitelist, barcode mapping
#   ├── bams/        ← sorted BAM + BAI
#   ├── counts/      ← reformatted genes x samples TSV
#   ├── logs/        ← per-rule logs
#   └── benchmarks/  ← per-rule benchmarks

result_dir: "results"

# add this
UMIs_dedup: True   # Set to True to deduplicate UMIs (default for BRB-seq)

# Set to True to generate and sort BAM files (takes more time)
# Set to False to skip BAM generation and only get count matrices
generate_bam: True

# ── BRB-seq / STARsolo parameters ─────────────────────────────────────────────
barcode_len: 14   # V5D kit: 14 bp barcode in R2
umi_len:     14    # V5D kit: 14 bp UMI following barcode in R2

# ── Thread allocation ─────────────────────────────────────────────────────────
threads:
  star:   16
  fastqc: 2

# ── Containers (verify tags) ──────────────────────────────────────────────────
# ── Containers (Aligned to your RNA-seq cache) ─────────────────────────────────
containers:
  fastqc:      "docker://quay.io/biocontainers/fastqc:0.12.1--hdfd78af_0"
  multiqc:     "docker://quay.io/biocontainers/multiqc:1.21--pyhdfd78af_0"    # <-- MATCHED to RNA-seq
  star:        "docker://quay.io/biocontainers/star:2.7.11b--h5ca1c30_8"               # <-- MATCHED to RNA-seq
  python:      "docker://continuumio/anaconda3:main"                          # Reusing Anaconda
  samtools:    "docker://quay.io/biocontainers/samtools:1.19--h50ea8bc_0"     # <-- MATCHED to RNA-seq
  anaconda:    "docker://continuumio/anaconda3:main"
  r_env:       "docker://gavinkarsters/rnaseq-r_env:v1"                       # <-- MATCHED to RNA-seq